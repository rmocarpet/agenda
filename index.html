<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Financeira</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #0f1420;
    color: #e8ecf4;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    margin: 0;
    padding: 24px 16px 60px;
  }
  .container { max-width: 1000px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  h1 { color: #7c9cf5; font-size: 28px; margin: 0 0 6px; }
  .subtitle { color: #8b93a7; font-size: 14px; }
  .subtitle.synced { color: #4ade80; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: #1a2035;
    border-radius: 12px;
    padding: 14px 16px;
  }
  .card .label { font-size: 12px; color: #8b93a7; text-transform: uppercase; }
  .card .value { font-size: 22px; font-weight: bold; margin-top: 4px; }
  .value.orange { color: #ff8a4c; }
  .value.green { color: #4ade80; }
  .value.yellow { color: #fbbf24; }
  .value.blue { color: #7c9cf5; }
  .value.red { color: #f87171; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 700px) { .panels { grid-template-columns: 1fr; } }
  .panel { background: #1a2035; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .panel h2 { font-size: 17px; margin: 0 0 12px; display:flex; align-items:center; gap:8px; }
  .badge { margin-left:auto; background:#2a3350; border-radius:10px; padding:2px 10px; font-size:13px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  input, select {
    background: #232a45;
    border: 1px solid #333d5c;
    color: #e8ecf4;
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14px;
    flex: 1;
    min-width: 90px;
  }
  button {
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-add { background: #3b6bf7; color: white; }
  .btn-add.green { background: #2ecc71; }
  .btn-pay { background: #3a3520; color: #fbbf24; border: 1px solid #6b5f2a; }
  .btn-edit { background: #2a3350; color: #7c9cf5; border: 1px solid #3d4a75; }
  .btn-del { background: transparent; color: #8b93a7; font-size: 18px; padding: 4px 8px; }
  .item {
    background: #232a45;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .item .info b { display:block; font-size:15px; }
  .item .info span { font-size: 13px; color: #8b93a7; }
  .item .actions { display: flex; gap: 6px; align-items: center; }
  .empty { text-align: center; color: #565f7a; padding: 20px 0; }
  .paid { opacity: 0.5; }
  .paid b { text-decoration: line-through; }
  .tag {
    display: inline-block;
    background: #16321f;
    color: #4ade80;
    border-radius: 6px;
    padding: 1px 8px;
    font-size: 12px;
    margin-left: 6px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>💰 Agenda Financeira</h1>
    <div class="subtitle" id="statusText">Conectando à nuvem...</div>
  </header>

  <div class="cards">
    <div class="card"><div class="label">Contas Fixas (mês)</div><div class="value orange" id="totalFixas">R$ 0,00</div></div>
    <div class="card"><div class="label">Pagamentos Únicos</div><div class="value orange" id="totalUnicos">R$ 0,00</div></div>
    <div class="card"><div class="label">Receitas (mês)</div><div class="value green" id="totalReceitas">R$ 0,00</div></div>
    <div class="card"><div class="label">Saldo</div><div class="value blue" id="totalSaldo">R$ 0,00</div></div>
    <div class="card"><div class="label">Já Pago</div><div class="value green" id="totalPago">R$ 0,00</div></div>
    <div class="card"><div class="label">Tarefas Pendentes</div><div class="value yellow" id="totalTarefas">0</div></div>
  </div>

  <div class="panel">
    <h2>💵 Receitas <span class="badge" id="countReceitas">0</span></h2>
    <div class="row">
      <input id="receitaNome" placeholder="Descrição (ex: Banco de carro Ednaldo)">
      <input id="receitaValor" type="number" placeholder="Valor R$">
      <select id="receitaCategoria">
        <option value="DoorDash">DoorDash</option>
        <option value="RMO Carpet & Upholstery">RMO Carpet & Upholstery</option>
        <option value="Gorjeta">Gorjeta</option>
        <option value="Outro">Outro</option>
      </select>
      <input id="receitaData" type="date">
      <button class="btn-add green" onclick="addReceita()">Adicionar</button>
    </div>
    <div id="listaReceitas"></div>
  </div>

  <div class="panels">
    <div class="panel">
      <h2>📌 Contas Fixas Mensais <span class="badge" id="countFixas">0</span></h2>
      <div class="row">
        <input id="fixaNome" placeholder="Nome (ex: Aluguel)">
        <input id="fixaValor" type="number" placeholder="Valor R$">
        <input id="fixaDia" type="number" placeholder="Dia venc.">
        <button class="btn-add" onclick="addFixa()">Adicionar</button>
      </div>
      <div id="listaFixas"></div>
    </div>

    <div class="panel">
      <h2>💳 Pagamentos Únicos <span class="badge" id="countUnicos">0</span></h2>
      <div class="row">
        <input id="unicoNome" placeholder="Nome (ex: Presente)">
        <input id="unicoValor" type="number" placeholder="Valor R$">
        <input id="unicoData" type="date">
        <button class="btn-add" onclick="addUnico()">Adicionar</button>
      </div>
      <div id="listaUnicos"></div>
    </div>
  </div>

  <div class="panel">
    <h2>✅ Lista de Tarefas <span class="badge" id="countTarefas">0</span></h2>
    <div class="row">
      <input id="tarefaDesc" placeholder="Descreva a tarefa">
      <button class="btn-add" onclick="addTarefa()">Adicionar</button>
    </div>
    <div id="listaTarefas"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBjr_yU9SQMGEX4R7bBvoNxfK_bEG9hC18",
  authDomain: "agenda-rmo.firebaseapp.com",
  projectId: "agenda-rmo",
  storageBucket: "agenda-rmo.firebasestorage.app",
  messagingSenderId: "175747246996",
  appId: "1:175747246996:web:48432b7957741140c37d81"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById('statusText').textContent = '☁️ Seus dados são sincronizados automaticamente entre seus aparelhos';
document.getElementById('statusText').classList.add('synced');

function fmt(v) {
  return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

// ---------- RECEITAS ----------
const receitasCol = collection(db, 'receitas');
let receitasCache = [];
onSnapshot(query(receitasCol, orderBy('criadoEm')), (snap) => {
  const el = document.getElementById('listaReceitas');
  el.innerHTML = '';
  let total = 0;
  receitasCache = [];
  if (snap.empty) { el.innerHTML = '<div class="empty">Nenhuma receita ainda</div>'; }
  snap.forEach(d => {
    const it = d.data();
    receitasCache.push(it);
    total += Number(it.valor || 0);
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <div class="info"><b>${it.nome} <span class="tag">${it.categoria || 'Outro'}</span></b><span>${fmt(it.valor)}${it.data ? ' · ' + it.data.split('-').reverse().join('/') : ''}</span></div>
      <div class="actions">
        <button class="btn-edit" onclick="editReceita('${d.id}','${it.nome}',${it.valor},'${it.categoria||''}','${it.data||''}')">✏️</button>
        <button class="btn-del" onclick="delReceita('${d.id}')">✕</button>
      </div>`;
    el.appendChild(div);
  });
  document.getElementById('totalReceitas').textContent = fmt(total);
  document.getElementById('countReceitas').textContent = snap.size;
  recalcSaldo();
});

window.addReceita = async () => {
  const nome = document.getElementById('receitaNome').value.trim();
  const valor = parseFloat(document.getElementById('receitaValor').value);
  const categoria = document.getElementById('receitaCategoria').value;
  const data = document.getElementById('receitaData').value || null;
  if (!nome || !valor) return alert('Preencha nome e valor');
  await addDoc(receitasCol, { nome, valor, categoria, data, criadoEm: Date.now() });
  document.getElementById('receitaNome').value = '';
  document.getElementById('receitaValor').value = '';
  document.getElementById('receitaData').value = '';
};
window.delReceita = async (id) => { if(confirm('Apagar esta receita?')) deleteDoc(doc(db,'receitas',id)); };
window.editReceita = async (id, nomeAtual, valorAtual, catAtual, dataAtual) => {
  const nome = prompt('Descrição:', nomeAtual); if (nome === null) return;
  const valor = prompt('Valor R$:', valorAtual); if (valor === null) return;
  const categoria = prompt('Categoria (DoorDash / RMO Carpet & Upholstery / Gorjeta / Outro):', catAtual); if (categoria === null) return;
  const data = prompt('Data (AAAA-MM-DD):', dataAtual); if (data === null) return;
  await updateDoc(doc(db,'receitas',id), { nome, valor: parseFloat(valor), categoria, data: data || null });
};

// ---------- CONTAS FIXAS ----------
const fixasCol = collection(db, 'contasFixas');
let fixasCache = [];
onSnapshot(query(fixasCol, orderBy('criadoEm')), (snap) => {
  const el = document.getElementById('listaFixas');
  el.innerHTML = '';
  let total = 0, count = 0;
  fixasCache = [];
  if (snap.empty) { el.innerHTML = '<div class="empty">Nenhum item ainda</div>'; }
  snap.forEach(d => {
    const it = d.data();
    fixasCache.push(it);
    count++;
    if (!it.pago) total += Number(it.valor || 0);
    const div = document.createElement('div');
    div.className = 'item' + (it.pago ? ' paid' : '');
    div.innerHTML = `
      <div class="info"><b>${it.nome}</b><span>${fmt(it.valor)} · vence dia ${it.dia || '-'}</span></div>
      <div class="actions">
        <button class="btn-edit" onclick="editFixa('${d.id}','${it.nome}',${it.valor},${it.dia||0})">✏️</button>
        <button class="btn-pay" onclick="togglePagoFixa('${d.id}', ${!it.pago})">${it.pago ? 'Desmarcar' : 'Marcar pago'}</button>
        <button class="btn-del" onclick="delFixa('${d.id}')">✕</button>
      </div>`;
    el.appendChild(div);
  });
  document.getElementById('totalFixas').textContent = fmt(total);
  document.getElementById('countFixas').textContent = count;
  recalcPago();
});

window.addFixa = async () => {
  const nome = document.getElementById('fixaNome').value.trim();
  const valor = parseFloat(document.getElementById('fixaValor').value);
  const dia = parseInt(document.getElementById('fixaDia').value) || null;
  if (!nome || !valor) return alert('Preencha nome e valor');
  await addDoc(fixasCol, { nome, valor, dia, pago: false, criadoEm: Date.now() });
  document.getElementById('fixaNome').value = '';
  document.getElementById('fixaValor').value = '';
  document.getElementById('fixaDia').value = '';
};
window.togglePagoFixa = async (id, pago) => updateDoc(doc(db,'contasFixas',id), { pago });
window.delFixa = async (id) => { if(confirm('Apagar este item?')) deleteDoc(doc(db,'contasFixas',id)); };
window.editFixa = async (id, nomeAtual, valorAtual, diaAtual) => {
  const nome = prompt('Nome:', nomeAtual); if (nome === null) return;
  const valor = prompt('Valor R$:', valorAtual); if (valor === null) return;
  const dia = prompt('Dia de vencimento:', diaAtual); if (dia === null) return;
  await updateDoc(doc(db,'contasFixas',id), { nome, valor: parseFloat(valor), dia: parseInt(dia)||null });
};

// ---------- PAGAMENTOS ÚNICOS ----------
const unicosCol = collection(db, 'pagamentosUnicos');
let unicosCache = [];
onSnapshot(query(unicosCol, orderBy('criadoEm')), (snap) => {
  const el = document.getElementById('listaUnicos');
  el.innerHTML = '';
  let total = 0, count = 0;
  unicosCache = [];
  if (snap.empty) { el.innerHTML = '<div class="empty">Nenhum item ainda</div>'; }
  snap.forEach(d => {
    const it = d.data();
    unicosCache.push(it);
    count++;
    if (!it.pago) total += Number(it.valor || 0);
    const div = document.createElement('div');
    div.className = 'item' + (it.pago ? ' paid' : '');
    div.innerHTML = `
      <div class="info"><b>${it.nome}</b><span>${fmt(it.valor)}${it.data ? ' · ' + it.data.split('-').reverse().join('/') : ' · sem data'}</span></div>
      <div class="actions">
        <button class="btn-edit" onclick="editUnico('${d.id}','${it.nome}',${it.valor},'${it.data||''}')">✏️</button>
        <button class="btn-pay" onclick="togglePagoUnico('${d.id}', ${!it.pago})">${it.pago ? 'Desmarcar' : 'Marcar pago'}</button>
        <button class="btn-del" onclick="delUnico('${d.id}')">✕</button>
      </div>`;
    el.appendChild(div);
  });
  document.getElementById('totalUnicos').textContent = fmt(total);
  document.getElementById('countUnicos').textContent = count;
  recalcPago();
});

window.addUnico = async () => {
  const nome = document.getElementById('unicoNome').value.trim();
  const valor = parseFloat(document.getElementById('unicoValor').value);
  const data = document.getElementById('unicoData').value || null;
  if (!nome || !valor) return alert('Preencha nome e valor');
  await addDoc(unicosCol, { nome, valor, data, pago: false, criadoEm: Date.now() });
  document.getElementById('unicoNome').value = '';
  document.getElementById('unicoValor').value = '';
  document.getElementById('unicoData').value = '';
};
window.togglePagoUnico = async (id, pago) => updateDoc(doc(db,'pagamentosUnicos',id), { pago });
window.delUnico = async (id) => { if(confirm('Apagar este item?')) deleteDoc(doc(db,'pagamentosUnicos',id)); };
window.editUnico = async (id, nomeAtual, valorAtual, dataAtual) => {
  const nome = prompt('Nome:', nomeAtual); if (nome === null) return;
  const valor = prompt('Valor R$:', valorAtual); if (valor === null) return;
  const data = prompt('Data (AAAA-MM-DD):', dataAtual); if (data === null) return;
  await updateDoc(doc(db,'pagamentosUnicos',id), { nome, valor: parseFloat(valor), data: data || null });
};

// ---------- TAREFAS ----------
const tarefasCol = collection(db, 'tarefas');
onSnapshot(query(tarefasCol, orderBy('criadoEm')), (snap) => {
  const el = document.getElementById('listaTarefas');
  el.innerHTML = '';
  let pendentes = 0;
  if (snap.empty) { el.innerHTML = '<div class="empty">Nenhum item ainda</div>'; }
  snap.forEach(d => {
    const it = d.data();
    if (!it.feita) pendentes++;
    const div = document.createElement('div');
    div.className = 'item' + (it.feita ? ' paid' : '');
    div.innerHTML = `
      <div class="info"><b>${it.desc}</b></div>
      <div class="actions">
        <button class="btn-pay" onclick="toggleTarefa('${d.id}', ${!it.feita})">${it.feita ? 'Reabrir' : 'Concluir'}</button>
        <button class="btn-del" onclick="delTarefa('${d.id}')">✕</button>
      </div>`;
    el.appendChild(div);
  });
  document.getElementById('countTarefas').textContent = snap.size;
  document.getElementById('totalTarefas').textContent = pendentes;
});

window.addTarefa = async () => {
  const desc = document.getElementById('tarefaDesc').value.trim();
  if (!desc) return;
  await addDoc(tarefasCol, { desc, feita: false, criadoEm: Date.now() });
  document.getElementById('tarefaDesc').value = '';
};
window.toggleTarefa = async (id, feita) => updateDoc(doc(db,'tarefas',id), { feita });
window.delTarefa = async (id) => { if(confirm('Apagar esta tarefa?')) deleteDoc(doc(db,'tarefas',id)); };

// ---------- TOTAIS ----------
function recalcPago() {
  let total = 0;
  fixasCache.forEach(i => { if (i.pago) total += Number(i.valor||0); });
  unicosCache.forEach(i => { if (i.pago) total += Number(i.valor||0); });
  document.getElementById('totalPago').textContent = fmt(total);
  recalcSaldo();
}
function recalcSaldo() {
  let totalReceitas = 0;
  receitasCache.forEach(i => { totalReceitas += Number(i.valor||0); });
  let totalPago = 0;
  fixasCache.forEach(i => { if (i.pago) totalPago += Number(i.valor||0); });
  unicosCache.forEach(i => { if (i.pago) totalPago += Number(i.valor||0); });
  const saldo = totalReceitas - totalPago;
  const saldoEl = document.getElementById('totalSaldo');
  saldoEl.textContent = fmt(saldo);
  saldoEl.className = 'value ' + (saldo >= 0 ? 'blue' : 'red');
}
</script>
</body>
</html>
